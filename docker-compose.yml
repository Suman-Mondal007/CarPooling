services:
  mongodb:
    image: mongo:7.0
    container_name: carpooling-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: carpooling
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: carpooling-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/carpooling
      - CLIENT_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=docker_jwt_access_secret_sample_key_16
      - JWT_REFRESH_SECRET=docker_jwt_refresh_secret_sample_key_16
    depends_on:
      - mongodb

volumes:
  mongo_data:
